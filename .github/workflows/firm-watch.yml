# Temporary: dry run of the team watch from a test branch. Reads only; nothing is saved.
name: Firm watch
on:
  workflow_dispatch:
    inputs:
      job:
        description: "unused"
        default: "crawl"
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: firm-watch
    env:
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      PIPELINE_SECRET: ${{ secrets.PIPELINE_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - name: Team watch (dry)
        run: node src/team.mjs --dry --limit 320 --discover-limit 320 --show 320
