name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci
          VITE_SUPABASE_PROJECT_ID: ci
  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - run: bash scripts/check-functions.sh
      - name: Unit tests for the shared rules
        working-directory: supabase/functions
        env: { DENO_NO_PACKAGE_JSON: "1" }
        run: deno test --no-lock _shared/tests/market_test.ts _shared/tests/tracker_test.ts _shared/tests/intel_test.ts
