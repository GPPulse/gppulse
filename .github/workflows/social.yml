# The newsletter's X account. Each pass writes the day's posts if the morning issue has gone out
# and they are not written yet, then publishes at most one post that is due. Five passes a
# weekday, about two and a half hours apart, so posts land through the working day.
# Does nothing until the four X_* secrets are set (see supabase/functions/social-x/index.ts).
name: Social posts
on:
  schedule:
    - cron: "7 12 * * 1-5"    # ~8am Eastern (7am in winter)
    - cron: "37 14 * * 1-5"
    - cron: "7 17 * * 1-5"
    - cron: "37 19 * * 1-5"
    - cron: "7 21 * * 1-5"
  workflow_dispatch:
    inputs:
      dry:
        description: "Show the next post without publishing it (true/false)"
        default: "false"
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FN: https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1/daily-newsletter-pipeline
      SECRET: ${{ secrets.PIPELINE_SECRET }}
      ANON: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - name: Write today's posts, then publish one
        run: |
          step() {
            body="{\"mode\":\"step\",\"step\":\"$1\",\"run_mode\":\"social\"${2:+,$2}}"
            code=$(curl -sS -o out.json -w '%{http_code}' --max-time 120 -X POST "$FN" \
              -H "Content-Type: application/json" -H "x-pipeline-secret: $SECRET" -H "Authorization: Bearer $ANON" -d "$body")
            echo "== $1 → HTTP $code"; head -c 2000 out.json; echo
          }
          step social-generate
          step social-post "\"dry\":${{ github.event.inputs.dry || 'false' }}"
