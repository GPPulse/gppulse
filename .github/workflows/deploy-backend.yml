# Deploys the Supabase side on every push to main: migrations, edge functions, secrets.
# Required repository secrets:
#   SUPABASE_ACCESS_TOKEN  personal access token (supabase.com → Account → Access Tokens)
#   SUPABASE_PROJECT_REF   e.g. abcdefghijklmnop
#   SUPABASE_DB_PASSWORD   database password set when the project was created
# Optional — set any of these and they are pushed as edge-function secrets:
#   RESEND_API_KEY FIRECRAWL_API_KEY ANTHROPIC_API_KEY OPENAI_API_KEY OPENAI_BASE_URL AI_PROVIDER FRED_API_KEY
#   NEWSLETTER_FROM NEWSLETTER_REPLY_TO NEWSLETTER_POSTAL_ADDRESS NEWSLETTER_EDITOR_NAME NEWSLETTER_EDITOR_TITLE
#   SITE_URL RESEND_WEBHOOK_SECRET PIPELINE_SECRET AUTO_SEND
name: Deploy backend
on:
  push:
    branches: [main]
    paths: ["supabase/**", ".github/workflows/deploy-backend.yml"]
  workflow_dispatch:
concurrency: deploy-backend
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF"
      - name: Apply migrations
        run: supabase db push --include-all
      - name: Deploy edge functions
        run: supabase functions deploy --project-ref "$PROJECT_REF"
      - name: Push secrets
        run: |
          : > .secrets.env
          for k in RESEND_API_KEY FIRECRAWL_API_KEY ANTHROPIC_API_KEY OPENAI_API_KEY OPENAI_BASE_URL AI_PROVIDER FRED_API_KEY \
                   NEWSLETTER_FROM NEWSLETTER_REPLY_TO NEWSLETTER_POSTAL_ADDRESS NEWSLETTER_EDITOR_NAME NEWSLETTER_EDITOR_TITLE \
                   SITE_URL RESEND_WEBHOOK_SECRET PIPELINE_SECRET AUTO_SEND; do
            v="${!k:-}"; [ -n "$v" ] && printf '%s=%s\n' "$k" "$v" >> .secrets.env
          done
          if [ -s .secrets.env ]; then supabase secrets set --project-ref "$PROJECT_REF" --env-file .secrets.env; else echo "no secrets provided"; fi
          rm -f .secrets.env
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          AI_PROVIDER: ${{ secrets.AI_PROVIDER }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          NEWSLETTER_FROM: ${{ secrets.NEWSLETTER_FROM }}
          NEWSLETTER_REPLY_TO: ${{ secrets.NEWSLETTER_REPLY_TO }}
          NEWSLETTER_POSTAL_ADDRESS: ${{ secrets.NEWSLETTER_POSTAL_ADDRESS }}
          NEWSLETTER_EDITOR_NAME: ${{ secrets.NEWSLETTER_EDITOR_NAME }}
          NEWSLETTER_EDITOR_TITLE: ${{ secrets.NEWSLETTER_EDITOR_TITLE }}
          SITE_URL: ${{ secrets.SITE_URL }}
          RESEND_WEBHOOK_SECRET: ${{ secrets.RESEND_WEBHOOK_SECRET }}
          PIPELINE_SECRET: ${{ secrets.PIPELINE_SECRET }}
          AUTO_SEND: ${{ secrets.AUTO_SEND }}
